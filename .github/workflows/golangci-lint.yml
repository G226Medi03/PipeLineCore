name: golangci-lint

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".custom-gcl.yml"
      - "tools/nodeconstructor/**"
      - ".github/workflows/golangci-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golangci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Build custom linter
        run: golangci-lint custom

      - name: Run custom linter
        run: ./bin/custom-gcl run ./...
