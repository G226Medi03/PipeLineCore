version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - nodeconstructor
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    custom:
      nodeconstructor:
        type: module
        description: forbid direct construction of core.Node

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1006
